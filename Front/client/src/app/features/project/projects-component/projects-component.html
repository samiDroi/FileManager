<div class="header">
  <h2>Gestión de proyectos</h2>
  <app-create-button 
    [label]="'+ Nuevo Proyecto'" 
    (clicked)="openCreateProjectModal()">  
  </app-create-button>
</div>

<div class="toolbar">
  <app-ui-search-bar 
    placeholder="Buscar proyectos..." 
    (search)="onSearch($event)">
  </app-ui-search-bar>
</div>

<app-list-projects 
  [projectsList]="projectsList()" 
  [isLoading]="loading()"
  (editProject)="openEditProjectModal($event)"
  (goToFiles)="openFilesModal($event)">
</app-list-projects>
