<div class="header">
  <h2>Gestion de clientes</h2>
  <app-create-button 
    [label]="'+ Nuevo Cliente'" 
    (clicked)="openCreateClientModal()">  
  </app-create-button>
</div>

<div class="toolbar">
  <app-ui-search-bar 
    placeholder="Buscar clientes..." 
    (search)="onSearch($event)">
  </app-ui-search-bar>
</div>

<app-list-clients 
  [clients]="clientsList()" 
  [isLoading]="loading()"
  (createClient)="openCreateClientModal()"
  (editClient)="openEditClientModal($event)"
  (createproject)="openCreateProjectModal($event)">
</app-list-clients>
