<div class="custom-modal-container">
      
      <div class="modal-header">
        <h2>{{ isEdit ? 'Editar Cliente' : 'Nuevo Cliente' }}</h2>
        <button class="close-icon" (click)="onCancel()">×</button>
      </div>
      
      <form [formGroup]="clientForm" class="modal-body">
        <app-form-input 
          type="text"
          placeholder="Ej. Juan Pérez"
          [control]="clientForm.get('name')!">
        </app-form-input>

        <app-form-input 
          type="text"
          placeholder="Ej. +1 (555) 123-4567"
          [control]="clientForm.get('contact_phone')!">
        </app-form-input>

        <app-form-input 
          type="email"
          placeholder="juan@correo.com"
          [control]="clientForm.get('email')!">
        </app-form-input>
      </form>

      <div class="modal-footer">
        <app-cancel-button 
          [label]="'Cancelar'" 
          (clicked)="onCancel()">  
        </app-cancel-button>
        <app-confirm-button 
          [text]="isEdit ? 'Actualizar' : 'Guardar'" 
          type="button"
          [isDisabled]="clientForm.invalid" 
          (clicked)="onSubmit()">  
        </app-confirm-button>
      </div>

    </div>
