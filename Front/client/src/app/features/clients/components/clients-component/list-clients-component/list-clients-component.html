@if(isLoading){
  <div class="loading-state" style="padding: 2rem; text-align: center; color: #6b7280;">
    <p>Cargando clientes...</p>
  </div>
}@else{
  <ng-template #clientRow let-client>
    <td>
      <div class="cell-main-text">{{ client.name }}</div>
    </td>
    <td>
      <span class="status-badge active">{{ client.countprojects }}</span>
    </td>
     <td>
      <span >{{ client.created_at }}</span>
    </td>
  </ng-template>


  <app-ui-table 
    [data]="clients" 
    [rowTemplate]="clientRow" 
    [colSpan]="3"
    (createProject)="onCreateProject($event)"
    (editItem)="onEditItem($event)">
    
    <thead>
      <tr>
        <th>Nombre del Cliente</th>
        <th>No. projectos afiliados</th>
        <th>Fecha de alta</th>
        <th>Acciones</th>
      </tr>
    </thead>
    
    <div empty-state>
      <p>No hay clientes disponibles.</p>
    </div>
    
  </app-ui-table>
}
