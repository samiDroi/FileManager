<div class="c-signin-container">
  
  <header class="c-signin-header">
    <img src="https://img.logo.dev/logos/column.com?token=pk_logo_r4k_z1h_j7b_l0n_c6m_y8j" alt="Company Logo" class="c-logo">
    <h1 class="c-title">Sign in</h1>
  </header>

  <form [formGroup]="signInForm" (ngSubmit)="onSignIn()" class="c-form">
    
    <div class="c-input-group">
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        placeholder="Email address"
        class="c-input"
        [class.c-input-error]="signInForm.get('email')?.touched && signInForm.get('email')?.errors"
        required>
    </div>

    <div class="c-input-group c-password-group">
      <input 
        [type]="isPasswordVisible ? 'text' : 'password'" 
        id="password" 
        formControlName="password" 
        placeholder="Password"
        class="c-input"
        [class.c-input-error]="signInForm.get('password')?.touched && signInForm.get('password')?.errors"
        required>
      
      <button type="button" (click)="togglePasswordVisibility()" class="c-password-toggle">
        <span class="icon-eye">{{ isPasswordVisible ? '👁️' : '🕶️' }}</span>
      </button>
    </div>

    <button type="submit" class="c-button-primary" [disabled]="signInForm.invalid">
      Sign in
    </button>
  </form>

  <div class="c-actions">
    <button type="button" (click)="onForgotPassword()" class="c-link">Forgot your password?</button>
    
    <div class="c-no-account-divider">
      <p class="c-text-muted">Don't have a Column account?</p>
      <button type="button" (click)="onCreateAccount()" class="c-button-secondary">Create new account</button>
    </div>
  </div>

</div>
