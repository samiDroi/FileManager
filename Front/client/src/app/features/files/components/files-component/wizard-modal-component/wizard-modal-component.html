<div class="modal-container">
    <div class="modal-header">
        <h2>Subir Archivo</h2>
        <button class="close-icon" (click)="onClose()">×</button>
    </div>
    <div class="modal-body">
        @switch (actualView()) {
    @case (View.DRAG){
        <app-drag-drop-zone 
        (fileSelected)="onFileDragged($event)"></app-drag-drop-zone>
    }
        
    @case (View.FORM){
            <app-file-form
             [fileTypes]="fileTypes()"
            [projects]="projects()"
            [preSelectedFile]="selectedFile()"
            (fileSubmit)="uploadFile($event)"></app-file-form>
    }
    @default {
        <p>Estado desconocido</p>
    }
}
    </div>
</div>
