<div class="top-section">
  <div class="top-icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16.5l-3.5 3.5M15 5l4 4M2 22l15-15L21 3l-4-4L2 14l3 3L2 22z"></path>
    </svg>
  </div>
  <h1>Forgot Password</h1>
  <p>No worries! Enter your email address below and we will send you a code to reset password.</p>
</div>

<div class="bottom-section">
  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>E-mail</label>
      <div class="input-wrapper">
        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.input-error]="emailControl.touched && emailControl.invalid">
      </div>
      @if (emailControl.touched && emailControl.invalid) {
        @if (emailControl.hasError('required')) {
          <div class="error-text">This field is required.</div>
        }
        @if (emailControl.hasError('email')) {
          <div class="error-text">Invalid email format.</div>
        }
      }
    </div>

    <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || isLoading()">
      @if (isLoading()) {
        Sending...
      } @else {
        Send Reset Instruction
      }
    </button>
  </form>
</div>
