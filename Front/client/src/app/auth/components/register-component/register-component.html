<h1>Registrarse</h1>
<form [formGroup]=registerForm (ngSubmit) = onSubmit()>
  <app-form-input
  label="username"
  type="text"
  [control]="registerForm.controls.username"
  placeholder="Nombre de usuario">
  </app-form-input>

  <app-form-input 
  label="email"
    type="email"
    [control]="registerForm.controls.email"
    placeholder="tu@correo.com">
  </app-form-input>

  <app-form-input 
  label="password"
    type="password"
    [control]="registerForm.controls.password"
    placeholder="Tu contraseña secreta">
  </app-form-input>

  <app-confirm-button text="Registrar"
  variant="primary"></app-confirm-button>
<!-- <button type="submit" [disabled]="registerForm.invalid">Registrar</button> -->
</form>
