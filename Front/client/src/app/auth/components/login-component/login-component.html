<div class="c-signin-container">
  
  <header class="c-signin-header">
    <img src="https://img.logo.dev/logos/column.com?token=pk_logo_r4k_z1h_j7b_l0n_c6m_y8j" alt="Company Logo" class="c-logo">
    <h1 class="c-title">Sign in</h1>
  </header>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="c-form">
    
    <app-form-input 
      type="text"
      placeholder="Username"
      [control]="usernameControl">
    </app-form-input>

    <app-form-input 
      type="password"
      placeholder="Password"
      [control]="passwordControl">
    </app-form-input>

    <button type="submit" class="c-button-primary" [disabled]="loginForm.invalid">
      Sign in
    </button>
  </form>

  <div class="c-actions">
    <button type="button" (click)="onForgotPassword()" class="c-link">Forgot your password?</button>
    
    <div class="c-no-account-divider">
      <p class="c-text-muted">Don't have a Column account?</p>
      <button type="button" (click)="onCreateAccount()" class="c-button-secondary">Create new account</button>
    </div>
  </div>

</div>
