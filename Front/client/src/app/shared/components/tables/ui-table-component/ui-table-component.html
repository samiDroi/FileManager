<div class="table-container">
  <table class="modern-table">
    <ng-content select="thead"></ng-content>

    <tbody>
      @for (item of data(); track $index; let i = $index) {
        <tr>
          <ng-container *ngTemplateOutlet="rowTemplate(); context: { $implicit: item, $index: i }"></ng-container>
          <td class="actions-cell">
            <div class="actions-wrapper">
              <button class="menu-trigger" (click)="toggleMenu(i, $event)">
                <i class="fa fa-ellipsis-h"></i>
              </button>

              @if (activeMenuIndex === i) {
                <div class="context-menu" (click)="$event.stopPropagation()">
                  <button class="menu-item" (click)="onCreateItem(item)">
                    <i class="fa fa-plus"></i>
                    <span>Crear</span>
                  </button>
                  <button class="menu-item" (click)="onEditItem(item)">
                    <i class="fa fa-pencil"></i>
                    <span>Editar</span>
                  </button>
                </div>
              }
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td [colSpan]="colSpan()" class="empty-state">
            <ng-content select="[empty-state]"></ng-content>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
