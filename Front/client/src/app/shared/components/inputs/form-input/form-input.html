<div class="c-input-group">
  @if(label) {
    <label [for]="id" class="form-label">{{ label }}</label>
  }
  <div class="c-input-wrapper" [class.c-password-group]="type === 'password'">
    <input 
      [id]="id"
      [type]="inputType" 
      [formControl]="_control" 
      [placeholder]="placeholder"
      class="c-input"
      [class.c-input-error]="_control.touched && _control.invalid">
    
    @if (type === 'password') {
      <button 
        type="button" 
        (click)="togglePasswordVisibility()" 
        class="c-password-toggle">
        <i class="fas" [class.fa-eye]="isPasswordVisible" [class.fa-eye-slash]="!isPasswordVisible"></i>
      </button>
    }
  </div>

  @if (_control.touched && _control.invalid) {
    <div class="c-error-message">
      @if (_control.hasError('required')) {
        <small>Este campo es requerido.</small>
      }
      @if (_control.hasError('email')) {
        <small>Formato de correo inválido.</small>
      }
    </div>
  }
</div>
