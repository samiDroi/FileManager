<div class="layout-wrapper" [class.sidebar-collapsed]="sidebarCollapsed()">
  
  <app-sidebar 
    class="layout-sidebar"
    [collapsed]="sidebarCollapsed()"
    (requestExpand)="expandSidebar()"
    (onCreateClient)="openCreateClientModal()"
    [clientsList]="clients()"
    [hasProjects]="hasProjects()"
    [projectsLoaded]="projectsLoaded()">
  </app-sidebar>

  <main class="layout-main">
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="btn-toggle-sidebar"
          (click)="toggleSidebar()"
          [attr.aria-label]="sidebarCollapsed() ? 'Desplegar barra lateral' : 'Plegar barra lateral'"
          [attr.title]="sidebarCollapsed() ? 'Desplegar barra lateral' : 'Plegar barra lateral'">
          <i class="fa fa-bars"></i>
        </button>
        <h2>{{ pageTitle() }}</h2>
      </div>
      @let user = currentUser();
      @if (user) {
        <div class="user-strip">
          <div class="user-strip-info">
            <span class="name">{{ user.username }}</span>
            <span class="email">{{ user.email }}</span>
          </div>
          <span class="user-strip-avatar">{{ user.username.charAt(0) }}</span>
          <button class="btn-logout" (click)="handleLogout()" title="Cerrar Sesión">
            <i class="fa fa-sign-out"></i>
          </button>
        </div>
      }
    </header>
    
    <section class="content-area">
      <router-outlet></router-outlet> 
    </section>
  </main>

</div>
