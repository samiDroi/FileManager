<aside class="sidebar-container">
  <div class="brand">
    <h1><i class="fa fa-cloud"></i> File Manager</h1>
  </div>

  <div class="sidebar-section">
    <span class="section-label">Vistas Globales</span>
    <nav class="nav-menu">
      <a [routerLink]="[routes.files]" routerLinkActive="active" class="nav-item">
        <i class="fa fa-file"></i> <span class="label">Todos los Archivos</span>
      </a>
      <a [routerLink]="[routes.projects]" routerLinkActive="active" class="nav-item">
        <i class="fa fa-folder-open"></i> <span class="label">Todos los Proyectos</span>
      </a>
      <a [routerLink]="[routes.clients]" routerLinkActive="active" class="nav-item">
        <i class="fa fa-briefcase"></i> <span class="label">Todos los Clientes</span>
      </a>
    </nav>
  </div>

  <hr class="divider">

  <div class="sidebar-section clients-section">
    
    <div class="clients-header">
      <span class="section-label">Mis Clientes</span>
      <app-create-button 
        [label]="'+ Nuevo Cliente'" 
        (clicked)="emitCreateClient()">  
      </app-create-button>
    </div>

    <div class="search-container">
      <i class="fa fa-search search-icon"></i>
      <input type="text" class="search-input" placeholder="Filtrar clientes..." [(ngModel)]="searchTerm">
    </div>
    

    <div class="clients-scroll-area">
      @for (client of filteredClients; track client.id) {
        <div class="client-item" [routerLink]="['/overview/client', client.id]" routerLinkActive="active">
          <div class="client-summary">
            <i class="fa fa-building"></i> <span>{{ client.name }}</span>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="sidebar-footer">
    <a routerLink="/configuracion" class="nav-item">
      <i class="fa fa-cog"></i> <span class="label">Configuración</span>
    </a>

  </div>
</aside>
