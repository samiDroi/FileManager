<aside class="sidebar-container">
  <div class="brand">
    <h1>File Manager</h1>
  </div>
 <span class="label">Menu</span>
 <nav class="nav-menu">
 
  <a [routerLink]="[routes.users]" routerLinkActive="active" class="nav-item">
    <i class="fa fa-users"></i> 
    <span class="label">Usuarios</span>
  </a>

  <a [routerLink]='[routes.projects]' routerLinkActive="active" class="nav-item">
    <i class="fa fa-folder-open"></i> 
    <span class="label">proyectos</span>
  </a>

  <a [routerLink]="[routes.clients]" routerLinkActive="active" class="nav-item">
    <i class="fa fa-briefcase"></i> 
    <span class="label">Clientes</span>
  </a>
  <a [routerLink]="[routes.files]" routerLinkActive="active" class="nav-item">
    <i class="fa fa-file"></i> 
    <span class="label">Archivos</span>
  </a>
  <a routerLink="/configuracion" routerLinkActive="active" class="nav-item">
    <i class="fa fa-cog"></i> 
    <span class="label">Configuración</span>
  </a>
</nav>
  
@if(userData){
    <div class="user-footer">
    <div class="user-info">
      <!-- {{ userData }} -->
      <span class="name">{{ userData.username }}</span>
      <span class="role">{{ userData.email }}</span>
    </div>
    <app-cancel-button 
      [label]="'Cerrar Sesión'" 
      (clicked)="emitLogout()">  
    </app-cancel-button>
  </div>
}
</aside>
